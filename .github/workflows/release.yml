# Publishes a GitHub release with the three files Obsidian installs, after
# building and running the unit tests. Run it from the Actions tab ("Run
# workflow"), which tags the release with manifest.json's version, or push a
# tag that matches that version.
name: Release
on:
  workflow_dispatch:
  push:
    tags: ["*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Read the version from manifest.json
        id: v
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check a pushed tag matches manifest.json
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "${{ steps.v.outputs.version }}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes main.js manifest.json styles.css
